apiVersion: batch/v1
kind: Job
metadata:
  name: model-downloader
  namespace: default
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      serviceAccountName: qwen-ksa
      restartPolicy: Never
      containers:
      - name: downloader
        image: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
        env:
        - name: SOURCE_MODEL_GCS_URI
          value: "${SOURCE_MODEL_GCS_URI}"
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          mkdir -p /data/qwen-weights
          SOURCE="${SOURCE_MODEL_GCS_URI:-}"

          if [[ -n "$SOURCE" ]]; then
            echo "Copying Qwen3-8B from public GCS mirror: $SOURCE"
            gcloud storage rsync "$SOURCE" /data/qwen-weights --recursive
          else
            echo "SOURCE_MODEL_GCS_URI is not set. Falling back to anonymous Hugging Face download."
            python3 -m pip install --no-cache-dir -U huggingface_hub
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='Qwen/Qwen3-8B', local_dir='/data/qwen-weights')"
          fi

          test -f /data/qwen-weights/config.json || {
            echo "Model copy finished, but /data/qwen-weights/config.json was not found."
            echo "Set SOURCE_MODEL_GCS_URI to the directory that directly contains the model files."
            find /data/qwen-weights -maxdepth 2 -type f | head -20
            exit 1
          }
          echo "Download complete! Safe to proceed."
        volumeMounts:
        - name: gcs-fuse-volume
          mountPath: /data/qwen-weights
      volumes:
      - name: gcs-fuse-volume
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            bucketName: "${PROJECT_ID}-qwen-weights"
