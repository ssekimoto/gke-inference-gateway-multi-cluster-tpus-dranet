apiVersion: batch/v1
kind: Job
metadata:
  name: model-downloader
  namespace: default
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      serviceAccountName: qwen-ksa
      restartPolicy: Never
      containers:
      - name: downloader
        image: python:3.11-slim
        command:
        - bash
        - -c
        - |
          pip install -U huggingface_hub
          echo "Downloading Qwen3-8B directly to GCS bucket..."
          python3 -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='Qwen/Qwen3-8B', local_dir='/data/qwen-weights')"
          echo "Download complete! Safe to proceed."
        volumeMounts:
        - name: gcs-fuse-volume
          mountPath: /data/qwen-weights
      volumes:
      - name: gcs-fuse-volume
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            bucketName: "${PROJECT_ID}-qwen-weights"
